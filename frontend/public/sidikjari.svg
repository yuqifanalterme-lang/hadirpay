<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 467" width="534" height="467" fill="none">
  <!-- Clean Modern Phone (Enlarged, No Harsh Blue Border, No Clutter) -->
  <g transform="translate(137, 36)">
    <!-- 3D Base Thickness / Soft Edge -->
    <rect x="8" y="10" width="260" height="388" rx="38" fill="#dbeafe" />

    <!-- Main Phone Body (Clean White, Soft Light Border) -->
    <rect x="0" y="0" width="260" height="388" rx="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Screen Bezel Area -->
    <rect x="14" y="16" width="232" height="356" rx="28" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Top Speaker Pill -->
    <rect x="106" y="28" width="48" height="6" rx="3" fill="#cbd5e1" />

    <!-- Screen Display Area (Soft Blue Inner Card) -->
    <rect x="26" y="52" width="208" height="304" rx="20" fill="#eff6ff" />

    <!-- Circular Radar Ring Behind Fingerprint -->
    <circle cx="130" cy="172" r="64" fill="#dbeafe" opacity="0.7" />
    <circle cx="130" cy="172" r="48" fill="#ffffff" />
    <circle cx="130" cy="172" r="48" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Fingerprint Icon (Clean Royal Blue Line Art) -->
    <g transform="translate(100, 140)" stroke="#2563eb" stroke-width="3" stroke-linecap="round">
      <path d="M16 12 A24 24 0 0 1 44 12" />
      <path d="M9 24 A31 31 0 0 1 51 24" />
      <path d="M6 38 A38 38 0 0 1 54 38" />
      <path d="M9 52 A30 30 0 0 1 51 52" />
      <path d="M16 64 C23 72 37 72 44 64" />
      <path d="M23 29 A12 12 0 0 1 37 29 C37 40 32 48 30 54" />
      <path d="M30 24 C26 24 24 31 27 38" />
    </g>

    <!-- Scan Line Accent -->
    <line x1="42" y1="172" x2="218" y2="172" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />

    <!-- Clean Success Checkmark Pill -->
    <g transform="translate(68, 268)">
      <rect x="0" y="0" width="124" height="52" rx="26" fill="#2563eb" />
      <circle cx="26" cy="26" r="15" fill="#ffffff" />
      <path d="M20 26 L24.5 30.5 L32 21" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Minimal Status Indicator Lines -->
      <rect x="52" y="19" width="54" height="6" rx="3" fill="#ffffff" />
      <rect x="52" y="30" width="36" height="5" rx="2.5" fill="#93c5fd" />
    </g>
  </g>
</svg>